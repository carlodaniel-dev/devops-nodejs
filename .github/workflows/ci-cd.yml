name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  KUSTOMIZE_VERSION: v5.4.3
  KUBECONFORM_VERSION: v0.8.0

jobs:
  # ------------------------------------------------------------------
  # 1) Build + pruebas unitarias + cobertura + análisis estático
  # ------------------------------------------------------------------
  build-test:
    name: Build, test & static analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarCloud necesita el historial completo

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (code build)
        run: npm ci

      - name: Static code analysis (ESLint)
        run: npm run lint

      - name: Unit tests + code coverage (umbral 80%)
        run: npm run test:coverage

      - name: Dependency vulnerabilities (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: SonarCloud analysis (opcional, requiere secret SONAR_TOKEN)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5

      - name: Install kustomize & kubeconform
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: Validate Kubernetes manifests
        run: kustomize build k8s | kubeconform -strict -summary -kubernetes-version 1.31.0

  # ------------------------------------------------------------------
  # 2) Docker build -> Trivy scan -> push a GHCR
  # ------------------------------------------------------------------
  docker:
    name: Docker build, scan & push
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tag
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan (Trivy) - falla con HIGH/CRITICAL con fix disponible
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Kubernetes manifests scan (Trivy misconfig) - informativo
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: k8s
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha

      - name: Summary
        run: |
          echo "### Imagen publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 3a) Deploy a un clúster Kubernetes efímero (kind) dentro del runner
  #     + smoke test. Demuestra el despliegue completo sin infraestructura propia.
  # ------------------------------------------------------------------
  deploy-kind:
    name: Deploy to Kubernetes (kind) + smoke test
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: devsu-demo

      - name: Install kustomize
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize

      - name: Pull image and load it into kind
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name devsu-demo

      - name: Create secrets
        run: bash scripts/create-secrets.sh   # contraseña aleatoria (clúster efímero)

      - name: Deploy
        run: |
          cd k8s
          kustomize edit set image devsu-demo-api="$IMAGE"
          cd ..
          kubectl apply -k k8s

      - name: Wait for rollout
        run: |
          kubectl -n devsu-demo rollout status statefulset/postgres --timeout=180s
          kubectl -n devsu-demo rollout status deployment/devsu-demo-api --timeout=180s
          kubectl -n devsu-demo get pods,svc,ingress,hpa,pdb -o wide

      - name: Smoke test
        run: |
          kubectl -n devsu-demo port-forward svc/devsu-demo-api 8080:80 &
          sleep 5
          bash scripts/smoke-test.sh http://localhost:8080 | tee smoke.log
          { echo '### Smoke test'; echo '```'; cat smoke.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Debug info on failure
        if: failure()
        run: |
          kubectl -n devsu-demo get all
          kubectl -n devsu-demo describe pods
          kubectl -n devsu-demo logs -l app.kubernetes.io/name=devsu-demo-api --all-containers --tail=100

  # ------------------------------------------------------------------
  # 3b) Deploy a un clúster real (opcional). Se activa definiendo la variable
  #     de repositorio DEPLOY_TO_CLUSTER=true y los secrets KUBE_CONFIG (base64)
  #     y DB_PASSWORD.
  # ------------------------------------------------------------------
  deploy-cluster:
    name: Deploy to Kubernetes (external cluster)
    needs: [docker, deploy-kind]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_TO_CLUSTER == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: bash scripts/create-secrets.sh

      - name: Deploy
        run: |
          cd k8s
          kustomize edit set image devsu-demo-api="$IMAGE"
          cd ..
          kubectl apply -k k8s
          kubectl -n devsu-demo rollout status statefulset/postgres --timeout=300s
          kubectl -n devsu-demo rollout status deployment/devsu-demo-api --timeout=300s