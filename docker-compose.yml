# Entorno local: API + PostgreSQL.  Uso: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demo-local-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: demo
      DB_USER: demo
      DB_PASSWORD: ${DB_PASSWORD:-demo-local-password}
      DB_SYNC: "true"   # solo local; en Kubernetes lo hace el initContainer
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
