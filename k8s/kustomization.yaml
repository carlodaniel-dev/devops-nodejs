apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devsu-demo
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
# El pipeline reemplaza esto con: kustomize edit set image devsu-demo-api=<imagen>:<tag>
images:
  - name: devsu-demo-api
    newName: ghcr.io/carlodaniel-dev/devops-nodejs
    newTag: latest
