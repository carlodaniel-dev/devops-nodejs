apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsu-demo-api
  labels:
    app.kubernetes.io/name: devsu-demo-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # zero-downtime: nunca baja de 2 pods listos
  selector:
    matchLabels:
      app.kubernetes.io/name: devsu-demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devsu-demo-api
    spec:
      serviceAccountName: devsu-demo-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # usuario "node" de la imagen
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: devsu-demo-api
      initContainers:
        # Crea/actualiza el esquema antes de arrancar la app (con advisory lock).
        - name: migrate
          image: devsu-demo-api
          command: ["node", "scripts/migrate.js"]
          envFrom:
            - configMapRef:
                name: devsu-demo-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: devsu-demo-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devsu-demo-db
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: devsu-demo-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: devsu-demo-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: devsu-demo-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devsu-demo-db
                  key: DB_PASSWORD
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]   # deja que el Service/Ingress saquen el pod antes de SIGTERM
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
